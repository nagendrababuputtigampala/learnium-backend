name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "25"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and enforce coverage gate
        run: mvn -B verify
      - name: Quality gate evidence-tool tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  postgres-migration:
    name: Migration test on real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: learnium
          POSTGRES_USER: learnium
          POSTGRES_PASSWORD: learnium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnium -d learnium"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Flyway migrations + invariants against real PostgreSQL
        env:
          LEARINUM_PG_TEST: "true"
          LEARINUM_PG_URL: jdbc:postgresql://localhost:5432/learnium
          LEARINUM_PG_USERNAME: learnium
          LEARINUM_PG_PASSWORD: learnium
          GENERATION_WORKER_ENABLED: "false"
        run: mvn -B test -Dtest=PostgresMigrationTest -Dsurefire.failIfNoSpecifiedTests=false
