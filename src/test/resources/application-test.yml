# Test profile: run against in-memory H2 so tests need no real PostgreSQL.
# Flyway is disabled; Hibernate creates/drops the (empty) schema instead.
spring:
  datasource:
    url: jdbc:h2:mem:learnium-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
