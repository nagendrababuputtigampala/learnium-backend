# Migration profile: prove the Flyway migrations run cleanly in order against
# H2 in PostgreSQL mode and that the resulting schema validates against the
# JPA entities. Used only by MigrationTest.
spring:
  datasource:
    url: jdbc:h2:mem:learnium-migration;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# A test-only signing secret so the context satisfies the JWT gate without a
# demo/dev profile or the development fallback.
learnium:
  jwt:
    secret: <redacted>
