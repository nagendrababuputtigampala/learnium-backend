spring:
  application:
    name: learnium-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnium}
    username: ${DB_USERNAME:learnium}
    password: ${DB_PASSWORD:learnium}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: learnium
    default-schema: learnium

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Vendor-neutral OpenTelemetry export: set OTEL_EXPORTER_OTLP_ENDPOINT to any
  # OTLP collector (Grafana Cloud, Datadog, ...) and traces + metrics flow there.
  # Empty (the default) means no export — instrumentation still runs in-process.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
        step: ${OTEL_METRICS_STEP:1m}
