spring:
  application:
    name: learnium-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnium}
    username: ${DB_USERNAME:learnium}
    password: ${DB_PASSWORD:learnium}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: learnium
    default-schema: learnium

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
