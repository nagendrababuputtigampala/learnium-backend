spring:
  application:
    name: learnium-backend
  servlet:
    multipart:
      # Chapter PDFs are capped at 20 MB (validated again in the service so
      # the API answers with LRN-MAT-003, not a framework default).
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnium}
    username: ${DB_USERNAME:learnium}
    # No default: a forgotten DB_PASSWORD must fail fast, not silently fall
    # back to a published credential. Local flows set it explicitly (README
    # run-locally exports; docker compose passes it to the backend service).
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: learnium
    default-schema: learnium
  mail:
    # SMTP for transactional mail (invites, password resets). Defaults suit a
    # local Mailpit (docker compose provides one on localhost:1025).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}


learnium:
  jwt:
    # HS256 signing secret for access tokens, bound from the JWT_SECRET
    # environment variable. Production MUST set a real secret: when the value
    # is blank (or equals the published development literal), JwtService only
    # falls back to the development secret if a demo/dev profile is active or
    # JWT_DEV_SECRET_ALLOWED=true — otherwise startup fails fast.
    secret: ${JWT_SECRET:}
    dev-secret-allowed: ${JWT_DEV_SECRET_ALLOWED:false}
  outbox:
    # Key material for encrypting email-outbox payloads at rest (they carry
    # raw set-password tokens). Blank derives the key from the JWT secret
    # material instead; set OUTBOX_ENCRYPTION_KEY to decouple the two.
    encryption-key: ${OUTBOX_ENCRYPTION_KEY:}
  app:
    # Public origin of the frontend, used to build emailed set-password links.
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@learnium.local}
    dispatch-delay-ms: ${MAIL_DISPATCH_DELAY_MS:5000}
  platform:
    # Shared secret for the platform onboarding endpoint. Blank (the default)
    # disables POST /api/v1/platform/centres entirely (it answers 404).
    provisioning-key: ${PLATFORM_PROVISIONING_KEY:}
  storage:
    # Object storage for uploaded chapter files: `local` disk for
    # development, `s3` for any S3-compatible store (Cloudflare R2 in
    # production). Credentials come from the environment only.
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/files}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:us-east-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
  extraction:
    # PDF extraction budget and usability thresholds (see ExtractionProperties).
    timeout-seconds: ${EXTRACTION_TIMEOUT_SECONDS:30}
    max-extracted-chars: ${EXTRACTION_MAX_CHARS:200000}
    max-input-tokens: ${EXTRACTION_MAX_TOKENS:40000}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Vendor-neutral OpenTelemetry export: set OTEL_EXPORTER_OTLP_ENDPOINT to any
  # OTLP collector (Grafana Cloud, Datadog, ...) and traces + metrics flow there.
  # Empty (the default) means no export — instrumentation still runs in-process.
  # Property names are the Spring Boot 4 ones, verified against the Boot 4.0.0
  # configuration metadata: tracing export binds
  # management.opentelemetry.tracing.export.otlp.endpoint (the pre-4
  # management.otlp.tracing.endpoint is a deprecated relocation and is NOT
  # bound by the exporter); Micrometer's OTLP meter registry binds
  # management.otlp.metrics.export.*. The env value feeds both exporters
  # verbatim; if a collector needs per-signal URLs, override the two
  # properties separately (…/v1/traces and …/v1/metrics).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  # The endpoint properties themselves are deliberately NOT declared here:
  # OtelEndpointEnvironmentPostProcessor maps OTEL_EXPORTER_OTLP_ENDPOINT to
  # management.opentelemetry.tracing.export.otlp.endpoint and
  # management.otlp.metrics.export.url only when the variable is set (an
  # always-present placeholder would bind an invalid endpoint and the
  # exporter would reject it at startup).
  otlp:
    metrics:
      export:
        step: ${OTEL_METRICS_STEP:1m}
